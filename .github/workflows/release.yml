# Pull request -> test, so a broken change shows before it's merged.
# Push to main -> test -> build images -> GHCR. Installs pick them up through watchtower.
name: release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# releases run one at a time and never cancel; a pull request's newer push replaces its older run
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Backend vet and tests
        working-directory: backend
        run: |
          go vet ./...
          go test ./...
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        # the npm cache from setup-node is enough, skip the extra registry calls
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  publish:
    needs: test
    # images only come from main; a pull request just runs the tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: mediahub-backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: mediahub-web
            context: .
            dockerfile: frontend/Dockerfile
          - image: mediahub-bootstrap
            context: deploy/bootstrap
            dockerfile: deploy/bootstrap/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR names must be lowercase
          images: ghcr.io/mantie7553/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
